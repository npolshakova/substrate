{{- if .Values.prototypeControlplane.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "substrate.fullname" (list "prototype-controlplane-policy" .) }}
  namespace: {{ .Release.Namespace }}
data:
  policy.json: |
{{ .Values.prototypeControlplane.policy | toPrettyJson | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "prototype-controlplane" .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "prototype-controlplane" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: prototype-controlplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prototype-controlplane
  template:
    metadata:
      labels:
        app: prototype-controlplane
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "prototype-controlplane" .) }}
      containers:
      - name: prototype-controlplane
        image: {{ .Values.prototypeControlplane.image }}
        env:
        - name: PROTOTYPE_CONTROLPLANE_XDS_ADDR
          value: ":15010"
        - name: PROTOTYPE_CONTROLPLANE_METRICS_ADDR
          value: ":8080"
        - name: PROTOTYPE_CONTROLPLANE_POLICY_FILE
          value: /etc/prototype-controlplane/policy.json
        - name: PROTOTYPE_CONTROLPLANE_CREDENTIALS_DIR
          value: /etc/prototype-controlplane/credentials
        - name: PROTOTYPE_CONTROLPLANE_GATEWAY_NAMESPACE
          value: {{ .Values.prototypeControlplane.gatewayNamespace | quote }}
        - name: PROTOTYPE_CONTROLPLANE_GATEWAY_NAME
          value: {{ .Values.prototypeControlplane.gatewayName | quote }}
        - name: PROTOTYPE_CONTROLPLANE_TLS_CERT_FILE
          value: /etc/prototype-controlplane/tls/tls.crt
        - name: PROTOTYPE_CONTROLPLANE_TLS_KEY_FILE
          value: /etc/prototype-controlplane/tls/tls.key
        ports:
        - name: xds
          containerPort: 15010
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: policy
          mountPath: /etc/prototype-controlplane
          readOnly: true
        - name: credentials
          mountPath: /etc/prototype-controlplane/credentials
          readOnly: true
        - name: tls
          mountPath: /etc/prototype-controlplane/tls
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 2
      volumes:
      - name: policy
        configMap:
          name: {{ include "substrate.fullname" (list "prototype-controlplane-policy" .) }}
      - name: credentials
        projected:
          sources:
          - secret:
              name: openai-api-key
              optional: true
              items:
              - key: authorization
                path: openai-api-key/authorization
      - name: tls
        secret:
          secretName: substrate-egress-demo-tls
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "prototype-controlplane" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: prototype-controlplane
  ports:
  - name: xds
    port: 15010
    targetPort: xds
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list .Values.prototypeControlplane.gatewayName .) }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list .Values.prototypeControlplane.gatewayName .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.prototypeControlplane.gatewayName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.prototypeControlplane.gatewayName }}
  template:
    metadata:
      labels:
        app: {{ .Values.prototypeControlplane.gatewayName }}
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list .Values.prototypeControlplane.gatewayName .) }}
      containers:
      - name: agentgateway
        image: {{ .Values.images.agentgateway }}
        args:
        - -c
        - '{"config":{"adminAddr":"127.0.0.1:15000","readinessAddr":"0.0.0.0:15021","statsAddr":"0.0.0.0:15020"}}'
        env:
        - name: XDS_ADDRESS
          value: {{ printf "http://%s.%s.svc:15010" (include "substrate.fullname" (list "prototype-controlplane" .)) .Release.Namespace | quote }}
        - name: NAMESPACE
          value: {{ .Values.prototypeControlplane.gatewayNamespace | quote }}
        - name: GATEWAY
          value: {{ .Values.prototypeControlplane.gatewayName | quote }}
        ports:
        - name: tcp-egress
          containerPort: 15080
        - name: readiness
          containerPort: 15021
        - name: metrics
          containerPort: 15020
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 15021
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list .Values.prototypeControlplane.gatewayName .) }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.prototypeControlplane.gatewayName }}
  ports:
  - name: tcp-egress
    port: 15080
    targetPort: tcp-egress
  - name: readiness
    port: 15021
    targetPort: readiness
{{- end }}
